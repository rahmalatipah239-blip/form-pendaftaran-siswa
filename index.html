<!DOCTYPE html>
<html>
<head>
    <title>My Git Project</title>
</head>
<body>
    <h1>Halo Dunia Ku!</h1>
    
    <form>
        <label for="nama">Nama Lengkap:</label><br>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda"><br><br>
        
        <label for="nohp">Nomor HP:</label><br>
        <input type="tel" id="nohp" name="nohp" placeholder="Contoh: 081234567890"><br><br>

        <label>Jenis Kelamin:</label><br>
        <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki">
        <label for="laki">Laki-laki</label><br>
        
        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
        <label for="perempuan">Perempuan</label><br><br>

        <label for="alamat">Alamat Lengkap:</label><br>
        <textarea id="alamat" name="alamat" rows="4" cols="30" placeholder="Masukkan alamat Anda"></textarea><br><br>

        <label for="tanggal_lahir">Tanggal Lahir:</label><br>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir">
    </form>
</body>
</html>
